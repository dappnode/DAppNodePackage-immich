name: Bump upstream version

on:
  schedule:
    - cron: "00 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-upstream:
    uses: dappnode/workflows/.github/workflows/bump-upstream.yml@master
    with:
      use_variants: false
    secrets: inherit
